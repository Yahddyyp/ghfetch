[package]
name = "ghfetch-cli"
version = "1.2.0"
edition = "2024"
description = "Display your github status in a beautiful way"
license = "MIT"
repository = "https://github.com/Yahddyyp/ghfetch"
readme = "README.md"

[[bin]]
name = "ghfetch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
octocrab = "0.54.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = "0.12"
image = "0.25"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
